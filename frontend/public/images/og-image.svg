<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="530" r="150" fill="#0f3460" opacity="0.3"/>
  <circle cx="1100" cy="100" r="200" fill="#0f3460" opacity="0.2"/>
  
  <!-- Logo/Icon placeholder - Anchor symbol for "Drydock" -->
  <g transform="translate(500, 150)">
    <!-- Anchor shape -->
    <circle cx="100" cy="30" r="25" fill="none" stroke="#e94560" stroke-width="6"/>
    <line x1="100" y1="55" x2="100" y2="180" stroke="#e94560" stroke-width="6"/>
    <path d="M 40 140 Q 100 200 160 140" fill="none" stroke="#e94560" stroke-width="6"/>
    <line x1="60" y1="100" x2="140" y2="100" stroke="#e94560" stroke-width="6"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">
    WASM Drydock
  </text>
  
  <!-- Tagline -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#e94560" text-anchor="middle">
    One command. The whole loop.
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a0a0a0" text-anchor="middle">
    Fullstack Rust Web Development Made Simple
  </text>
</svg>
