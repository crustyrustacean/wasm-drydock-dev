# fly.toml app configuration file generated for wasm-drydock-dev on 2026-03-08T14:53:31-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wasm-drydock-dev'
primary_region = 'yyz'

[build]

[env]
  APP_ENVIRONMENT = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
